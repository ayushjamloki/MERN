<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        
        h1{ 
            color: red;
            text-align: center;
        }
        .contain{
            padding-top: 20px;
            text-align: center;
            margin: 10px;
        }
        .label{
            font-weight: bold;
        }
        #btn{
            background-color: rgb(12, 12, 193);
            color:white;
            padding: 15px 30px;
            border: none;
            font-size: large;
            cursor: pointer;
            text-align: center;
            display: block;
            margin: 20px auto;
  
        }
        #loginblock{
            
           border: 2px solid black;
           margin: 100px auto;
           padding: 20px;
           width: 300px;
        }

    </style>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    </head>
    <body>

    <div id="loginblock">
    <h1 id="logintitle">Registration Page</h1>
    <form>
        <div class ="contain">
            <label for="name" class="label">Name :</label>
            <input id="name" type="text" placeholder="Enter Your Name">
        </div>
        <div class ="contain">
             <label for="email" class="label">Email :</label>
            <input id="email" type="email" placeholder="Enter Your Email">
        </div>
        <div class ="contain">
            <label for="password" class="label">Password :</label>
            <input id="password" type="password" placeholder="Enter Your Password">
        </div>

        <button id="btn">Register</button>
       
    </form>
    </div>


    
</body>
</html>
