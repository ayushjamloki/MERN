<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Apply for Internship</h1>
    <form>
        <div>
            <label>Name :</label>
            <input type="text" placeholder="Enter Your Name">
        </div>
        <div>
            <label>Email :</label>
            <input type="email" placeholder="Enter Your Email Id">
        </div>
        <div>
            <label>DOB</label>
            <input type="date" placeholder="Enter your date of Birth">
        </div>
        <div>
            <label for="gender">Male</label>
             <input type="radio" name="gender" value="male">
            <label for="gender">Female</label>
            <input type="radio" name="gender" value="female" >
        </div>
        <div>
            <label for="months">Duration(months)</label>
            <input type="range" name="months" id="months" min="1" max="6" value="3">
        </div>
        <div>
            <label>Internship Domain</label>
            <select>
                <optgroup label="Web Devlopment">
                    <option>MERN internship</option>
                    <option>React js internship</option>
                    <option>Node js internship</option>
                    <option>React + FastApi</option>
                    <option>React + Springboot</option>
                </optgroup>
                <optgroup label="App Devlopment and Software">
                    <option>React Native internship</option>
                    <option>Android Studio internship</option>
                    <option>DevOps internship</option>
                </optgroup>
                <optgroup label="AI Engneering">
                    <option>AI/Ml internship</option>
                    <option>NLP internship</option>
                    <option>ML Eng. internship</option>
                    <option>Gen AI ENg.</option>
                    <option>LLM Eng.</option>
                </optgroup>
                <optgroup label="Data">
                    <option>Data Analysis</option>
                    <option>Data Science</option>
                    <option>Data Engineering</option>
                
                </optgroup>
            </select>
        </div>
         <div>
            <label>College</label>
            <input type="text" placeholder="Enter your College Name">
        </div>
         <div>
            <label>Address</label>
            <input type="address" placeholder="Enter your Address">
        </div>
        
        </div>
         <div>
            <label>Location</label>
            <select>
                <option>Onsite</option>
                <option>Hybrid</option>
                <option>Remote</option>
            </select>
        </div>
         <div>
            <label>Type of Internship</label>
            <select>
                <option>Paid</option>
                <option>Unpaid</option>
            </select>
        </div>
         <div>
            <label>Password</label>
            <input type="password" placeholder="Enter your password">
        </div>
        <button>
            Apply
        </button>

    </form>

</body>
</html>
