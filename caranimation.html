<!doctype html>
<html lang="en">
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        width: 100%;
        height: 100vh;
        display: flex;
        overflow: hidden;
        flex-direction: column;
      }
      .sky {
        height: 50%;
        width: 100%;
        position: relative;
      }
      .sky img {
        width: 100%;
        height: 115%;
      }
      .city {
        position: absolute;
        top: 245px;
        width: 100%;
        height: 50%;
      }
      .city img {
        width: 100%;
        height: 100%;
      }
      .helicopter {
        animation: moveheli 7s infinite linear;
        position: fixed;
        top: 50px;
        right: 25px;
      }
      .helicopter .helicopterbody {
        position: absolute;
        top: 73px;
        height: 150px;
        width: 400px;
        right: 50px;
      }
      .helicopter .mainblade {
        position: absolute;
        top: 60px;
        height: 33px;
        right: 143px;
        width: 238px;
        animation: rotateZ 300ms linear infinite;
        transform-origin: center;
      }
      .helicopter .backsideblade {
        position: absolute;
        top: 86px;
        right: 71px;
        height: 80px;
        width: 80px;
        animation: rotate 300ms infinite linear;
      }
      .road {
        height: 150px;
        width: 400px;
        position: relative;
        top: 55px;

        .road img {
          height: 100%;
          width: 100%;
        }
      }
      .car {
        position: absolute;
        height: 150px;
        width: 300px;
        top: 15px;
        left: 70px;
        animation: move 12s infinite linear;
      }
      .car img {
        height: 100%;
        width: 100%;
      }
      .car .wheel1 {
        height: 60px;
        width: 60px;
        position: absolute;
        top: 77px;
        left: 23px;
        animation: rotate 2s infinite linear;
      }
      .car .wheel1 img {
        height: 100%;
        width: 100%;
      }
      .car .wheel2 {
        height: 60px;
        width: 60px;
        position: absolute;
        top: 77px;
        left: 206px;
        animation: rotate 2s infinite linear;
      }
      .car .wheel2 img {
        height: 100%;
        width: 100%;
      }
      @keyframes move {
        0% {
          transform: translateX(-123%);
        }
        100% {
          transform: translateX(550%);
        }
      }
      @keyframes moveheli {
        0% {
          transform: translateX(500px);
        }
        100% {
          transform: translateX(-1234px);
        }
      }

      @keyframes rotate {
        0% {
          transform: rotate(0deg);
        }
        20%% {
          transform: rotate(90deg);
        }
        50% {
          transform: rotate(180deg);
        }
        75% {
          transform: rotate(270deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes rotateZ {
        0% {
          transform: rotateZ(0deg);
        }
        100% {
          transform: rotateZ(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sky">
        <img src="/caranimatiom/sky.jpg" />
        <div class="city">
          <img src="/caranimatiom/city.png" />
        </div>
        <div class="helicopter">
          <img class="helicopterbody" src="/caranimatiom/helicopterbody.png" />
          <img class="mainblade" src="/caranimatiom/mainblade.png" />
          <img class="backsideblade" src="/caranimatiom/Backsideblade.png" />
        </div>
      </div>
      <div class="road">
        <img src="/caranimatiom/road.jpg" />
        <div class="car">
          <img src="/caranimatiom/car.png" />
          <div class="wheel1">
            <img src="/caranimatiom/wheel.png" />
          </div>
          <div class="wheel2">
            <img src="/caranimatiom/wheel.png" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
