<html>
  <head>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .container {
        position: relative;
        left: 300px;
        top: 30px;
        width: 400px;
        height: 450px;
        border-radius: 7px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 7px;
      }
      .container input {
        width: 350px;
        height: 50px;
        padding: 5px;
        outline: none;
        border-color: #f4f9ff;
      }
      .container input:focus {
        border-color: #0066cc;
        background-color: #f4f9ff;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.25);
        outline: none;
        background-color: #f4f9ff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <label>Your Name</label>
      <input type="text" placeholder="name" />
      <label>Father's Name</label>
      <input type="text" placeholder="fathers name" />
      <label>Mother's Name</label>
      <input type="text" placeholder="mothers name" />
      <label>Continent</label>
      <input type="text" placeholder="your continent " />
      <label>Country</label>
      <input type="text" placeholder="Your Country" />
      <label>State </label>
      <input type="text" placeholder="your state" />
      <label>District</label>
      <input type="text" placeholder="your district" />
    </div>
  </body>
</html>
