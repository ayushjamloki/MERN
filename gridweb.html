<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        margin-left: 100px;
        margin-top: 40px;
        display: grid;
        grid-template-rows: repeat(3, 140px);
        gap: 7px 7px;
        grid-template-columns: repeat(4, 220px);
        gap: 5px 5px;
      }
      .img1 {
        grid-area: 1/1/4/2;
        border-radius: 7px;
        background-color: cadetblue;
        display: flex;
        flex-direction: column;
        gap: 340px;
        padding: 15px;
        box-shadow: 3px 5px 15px rgba(55, 55, 55, 0.7);
      }
      .img1 img {
        height: 100%;
        width: 100%;
      }
      .rating {
        width: 40px;
        height: 20px;
        background-color: rgb(214, 153, 153);
        border-radius: 20px;
        padding: 2px;
        padding-left: 7px;
      }
      .text {
        color: white;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .img2 {
        grid-area: 1/2/3/4;
        border-radius: 7px;
        background-color: rgb(237, 96, 15);
        display: flex;
        flex-direction: column;
        gap: 190px;
        padding: 15px;
        box-shadow: 3px 5px 15px rgba(55, 55, 55, 0.7);
      }
      .img3 {
        grid-area: 1/4/3/5;
        border-radius: 7px;
        background-color: rgb(205, 186, 13);
        display: flex;
        flex-direction: column;
        gap: 190px;
        padding: 15px;
        box-shadow: 3px 5px 15px rgba(55, 55, 55, 0.7);
      }
      .img4 {
        grid-area: 3/2/4/3;
        border-radius: 7px;
        background-color: rgb(26, 227, 36);
        display: flex;
        flex-direction: column;
        gap: 50px;
        padding: 15px;
        box-shadow: 3px 5px 15px rgba(55, 55, 55, 0.7);
      }
      .img5 {
        grid-area: 3/3/4/4;
        border-radius: 7px;
        background-color: rgb(93, 24, 167);
        display: flex;
        flex-direction: column;
        gap: 50px;
        padding: 15px;
        box-shadow: 3px 5px 15px rgba(55, 55, 55, 0.7);
      }
      .img6 {
        grid-area: 3/4/4/5;
        border-radius: 7px;
        background-color: rgb(159, 13, 71);
        display: flex;
        flex-direction: column;
        gap: 50px;
        padding: 15px;
        box-shadow: 3px 5px 15px rgba(55, 55, 55, 0.7);
      }
      h5 {
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="img1">
      <!-- <img src="images/image.png" alt="" /> -->
      <div class="rating">
        <h5>4.1</h5>
      </div>
      <div class="text">
        <h4>Himalayas</h4>
        <h6>Mountains</h6>
      </div>
    </div>
    <div class="img2">
      <div class="rating">
        <h5>4.9</h5>
      </div>
      <div class="text">
        <h4>London</h4>
        <h6>Beauty</h6>
      </div>
    </div>
    <div class="img3">
      <div class="rating">
        <h5>4.2</h5>
      </div>
      <div class="text">
        <h4>Tokyo</h4>
        <h6>Traditions</h6>
      </div>
    </div>
    <div class="img4">
      <div class="rating">
        <h5>4.7</h5>
      </div>
      <div class="text">
        <h4>Greece</h4>
        <h6>White Dome</h6>
      </div>
    </div>
    <div class="img5">
      <div class="rating">
        <h5>4.4</h5>
      </div>
      <div class="text">
        <h4>Sydney</h4>
        <h6>Waterfall</h6>
      </div>
    </div>
    <div class="img6">
      <div class="rating">
        <h5>4.8</h5>
      </div>
      <div class="text">
        <h4>Amsterdam</h4>
        <h6>Peace</h6>
      </div>
    </div>
  </body>
</html>
