<html>
  <head>
    <body>
      <form action="">
        <h1>Registration</h1>
        <div class="">
          <label for="">Uploads : </label>
          <input type="file" />
        </div>
        <div class="">
          <label for="">Name : </label>
          <input type="text" placeholder="Ayush" />
        </div>
        <div class="">
          <label for="">Email : </label>
          <input type="email" placeholder="Ayush@gmail.com" />
        </div>
        <div class="">
          <label for="">Password : </label>
          <input type="password" placeholder="*****" />
        </div>
        <div class="">
          <label for="">color : </label>
          <input type="color" />
        </div>
        <div class="">
          <label for="">Volume : </label>
          <input type="range" placeholder="Ayush" />
        </div>
        <div class="">
          <label for="">Address : </label>
          <input type="text" />
          <textarea cols="10" name="" id=""></textarea>
        </div>
        <div class="">
          <label for="">Country : </label>
          <select name="" id="">
            <optgroup label="Asian Con">
              <option value="men's clothing" disabled>Pakistan</option>
              <option value="">Bhutan</option>
              <option value="">Sri-Lanka</option>
              <option value="" selected>India</option>
            </optgroup>
            <optgroup label="South-East Asian">
              <option value="">Japan</option>
              <option value="">China</option>
            </optgroup>

            <optgroup label="North America">
              <option value="">Canada</option>
              <option value="">USA</option>
              <option value="">Mexico</option>
            </optgroup>

            <optgroup label="South America">
              <option value="">Chile</option>
              <option value="">Argentina</option>
              <option value="">Brazil</option>
            </optgroup>

            <optgroup label="Europe">
              <option value="">Italy</option>
              <option value="">France</option>
              <option value="">England</option>
            </optgroup>
          </select>
        </div>
        <div class="">
          <button>Register</button>
          <button>Reset</button>
        </div>
      </form>
    </body>
  </head>
</html>
