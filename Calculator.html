<html>

<head>
    <style>

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(45deg, #0a0a0a, #3a4452);

        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 270px;
            height: 400px;
            border-radius: 7px;
            box-shadow: 0px 3px 15px rgba(113, 115, 119, 0.7);
            position: relative;
            left: 380px;
            top: 70px;
            background: transparent;
            padding: 5px;
        }

        input {
            width: 254px;
            height: 60px;
            border-radius: 7px;
            outline: rgba(255, 255, 255, 0.74);
            padding-left: 10px;
            padding-top: 30px;
            background-color: rgba(255, 255, 255, 0.77);
            text-align: right;

        }

        .buttons {
            display: grid;
            grid-template-rows: repeat(5, 60px);
            gap: 3px 5px;
            grid-template-columns: repeat(4, 60px);
        }

        .no1 {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 4 / 1 / 5 / 2;
            border-radius: 50%;
        }

        .no2 {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 4 / 2 / 5 / 3;
            border-radius: 50%;
        }

        .no3 {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 4 / 3 / 5 / 4;
            border-radius: 50%;
        }

        .no4 {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 3 / 1/ 4 / 2;
            border-radius: 50%;
        }

        .no5 {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 3 / 2/ 4 / 3;
            border-radius: 50%;
        }

        .no6 {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 3 / 3/ 4 / 4;
            border-radius: 50%;
        }

        .no7 {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 2 / 1/ 3 / 2;
            border-radius: 50%;
        }

        .no8 {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 2 / 2/ 3 / 3;
            border-radius: 50%;
        }

        .no9 {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 2 / 3/ 3 / 4;
            border-radius: 50%;
        }

        .no0 {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 5 / 1 / 6 / 2;
            border-radius: 50%;
        }

        .point {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 5 / 2 / 6 / 3;
            border-radius: 50%;
        }

        .op-p {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 2 / 4 / 3 / 5;
            padding: 7px;
            color: white;
            font-size: 40;
            border-radius: 50%;
        }

        .op-m {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 3 / 4 / 4 / 5;
            padding: 7px;
            color: white;
            font-size: 40;
            border-radius: 50%;
        }

        .op-ml {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 4/ 4 / 5 / 5;
            padding: 7px;
            color: white;
            font-size: 40;
            border-radius: 50%;
        }

        .op-dv {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 1 / 4 / 2 / 5;
            padding: 7px;
            color: white;
            font-size: 40;
            border-radius: 50%;
        }

        .op-bracket {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 1 / 2 / 2 / 3;
            padding: 7px;
            color: white;
            font-size: 40;
            border-radius: 50%;
        }

        .op-eq {
            background-color: #fb7c14;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 5/ 3 / 6 / 5;
            border-radius: 7px;
            padding-left: 15px;
            padding-top: 7px;
        }

        .clear {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 1 / 1 / 2 / 2;
            padding: 7px;
            color: red;
            font-size: 40;
            border-radius: 50%;
        }

        .mod {
            background: transparent;
            box-shadow: 1px -3px 16px rgba(255, 255, 255, 0.1);
            grid-area: 1 / 3 / 2 / 4;
            padding: 7px;
            color: white;
            font-size: 40;
            border-radius: 50%;

        }

        h3 {
            color: white;
            font-size: 30px;
            position: relative;
            left: 20px;
            top: 10px;
        }

        h4 {
            color: #6dee0a;
            font-size: 23px;
            position: relative;
            left: 10px;
            top: 0px;
            padding: 5px;
        }

        .op-eq h4 {
            color: white;
        }

        .logo {
            position: fixed;
            right: -47px;
            top: 165px;
            background-color: white;
            padding: 7px;
            transform: rotate(90deg);
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="logo">
        <h5>Smart Calculator</h5>
    </div>
    <div class="container">
        <div class="inp">
            <input type="text" placeholder="0" id="inputbox">
        </div>
        <div class="Buttons">
            <div class="no1">
                <h3>1</h3>
            </div>
            <div class="no2">
                <h3>2</h3>
            </div>
            <div class="no3">
                <h3>3</h3>
            </div>
            <div class="no4">
                <h3>4</h3>
            </div>
            <div class="no5">
                <h3>5</h3>
            </div>
            <div class="no6">
                <h3>6</h3>
            </div>
            <div class="no7">
                <h3>7</h3>
            </div>
            <div class="no8">
                <h3>8</h3>
            </div>
            <div class="no9">
                <h3>9</h3>
            </div>
            <div class="no0">
                <h3>0</h3>
            </div>
            <div class="op-p">
                <h4>+</h4>
            </div>
            <div class="op-m">
                <h4>-</h4>
            </div>
            <div class="op-ml">
                <h4>*</h4>
            </div>
            <div class="op-dv">
                <h4>/</h4>
            </div>
            <div class="op-eq">
                <h4>Equal</h4>
            </div>
            <div class="op-bracket">
                <h4>()</h3>
            </div>
            <div class="point">
                <h4>.</h4>
            </div>
            <div class="clear">
                <h4>C</h4>
            </div>
            <div class="mod">
                <h4>%</h4>
            </div>
        </div>
    </div>

</body>

</html>
