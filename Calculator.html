<html>
    <head>
        <style>
            *{
                padding: 0;
                margin: 0;
                box-sizing: border-box;
            }
            .container{
                display: flex;
                flex-direction: column;
                gap: 10px;
                width: 270px;
                height: 400px;
                background-color:light-yellow;
                border-radius: 7px;
                box-shadow: 0px 0px 3px #0000009e;
                position: relative;
                left: 380px;
                top: 70px;
                border: 1px solid;
                background-color: rgb(45, 44, 44);
                padding: 5px;
            }
            .inp{
                width: 260px;
                height: 70px;
               background-color:rgb(218, 120, 0);
                border-radius: 7px;
                padding: 2px;
            }
            input{
                    width: 254px;
    height: 60px;
    border-radius: 7px;
    outline: none;
    padding-left: 10px;
    padding-top: 30px;
    background-color: rgb(227, 220, 220);
            }
            .buttons{
                 display: grid;
                 grid-template-rows: repeat(5, 60px);
                 gap: 3px 5px;
                 grid-template-columns: repeat(4, 60px);
            }

         .no1{
            background-color:rgb(218, 120, 0);
            border-radius: 7px;
             grid-area: 4 / 1 / 5 / 2;
         }
         .no2{
             background-color:rgb(218, 120, 0);
            border-radius: 7px;
            grid-area: 4 / 2 / 5 / 3;
         }
         .no3{
             background-color:rgb(218, 120, 0);
            border-radius: 7px;
            grid-area: 4 / 3 / 5 / 4;
         }
         .no4{
            background-color:rgb(218, 120, 0);
            border-radius: 7px;
            grid-area: 3 / 1/ 4 / 2;
         }
         .no5{
            background-color:rgb(218, 120, 0);
            border-radius: 7px;
             grid-area: 3 / 2/ 4 / 3;
         }
         .no6{
            background-color:rgb(218, 120, 0);
            border-radius: 7px;
             grid-area: 3 / 3/ 4 / 4;
         }
         .no7{
            background-color:rgb(218, 120, 0);
            border-radius: 7px;
            grid-area: 2 / 1/ 3 / 2;
         }
         .no8{
             background-color:rgb(218, 120, 0);
            border-radius: 7px;
             grid-area: 2 / 2/ 3 / 3;
         }
         .no9{
            background-color:rgb(218, 120, 0); 
            border-radius: 7px;
             grid-area: 2 / 3/ 3 / 4;
         }
         .no0{
             background-color:rgb(218, 120, 0);
            border-radius: 7px;
            grid-area: 5 / 1 / 6 / 2;
         }
        
         .point{
            background-color:rgb(218, 120, 0);
             border-radius: 7px;
              grid-area: 5 / 2 / 6 / 3;
         }
          .op-p{
            background-color: rgb(0, 0, 210);
             border-radius: 7px;
              grid-area: 2 / 4 / 3 / 5;
              padding: 7px;
              color: white;
               font-size: 40;
          }
          .op-m{
            background-color: rgb(0, 0, 210);
             border-radius: 7px;
              grid-area: 3 / 4 / 4 / 5;
               padding: 7px;
              color: white;
               font-size: 40;
          }
          .op-ml{
             background-color: rgb(0, 0, 210);
             border-radius: 7px;
              grid-area:  4/ 4 / 5 / 5;
               padding: 7px;
              color: white;
               font-size: 40;
          }
          .op-dv{
           background-color: rgb(0, 0, 210);
             border-radius: 7px;
              grid-area: 1 / 4 / 2 / 5;
               padding: 7px;
              color: white;
               font-size: 40;
          }
          .op-bracket{
            background-color: rgb(0, 0, 210);
             border-radius: 7px;
              grid-area: 1 / 2 / 2 / 3;
               padding: 7px;
              color: white;
               font-size: 40;
          }
          .op-eq{
            background-color: rgb(0, 0, 210);
             border-radius: 7px;
            grid-area:  5/ 3 / 6 / 5;

          }
          .clear{
            background-color:rgb(28, 121, 0); 
             border-radius: 7px;
             grid-area: 1 / 1 / 2 / 2;
            padding: 7px;
             color: red;
              font-size: 40;
         }
          .mod{
             background-color: rgb(0, 0, 210);
             border-radius: 7px;
              grid-area: 1 / 3 / 2 / 4;
               padding: 7px;
              color: white;
               font-size: 40;

         }
         h3{
            color: white;
    font-size: 35px;
    position: relative;
    left: 17px;
    top: 10px;
         }
         h4{
      color: white;
    font-size: 30px;
    position: relative;
    left: 10px;
    top: 0px;
    padding: 5px;
         }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="inp">
                <input type="text" placeholder="0">
            </div>
            <div class="Buttons">
                <div class="no1"><h3>1</h3></div>
                <div class="no2"><h3>2</h3></div>
                <div class="no3"><h3>3</h3></div>
                <div class="no4"><h3>4</h3></div>
                <div class="no5"><h3>5</h3></div>
                <div class="no6"><h3>6</h3></div>
                <div class="no7"><h3>7</h3></div>
                <div class="no8"><h3>8</h3></div>
                <div class="no9"><h3>9</h3></div>
                <div class="no0"><h3>0</h3></div>
                <div class="op-p"><h4>+</h4></div>
                <div class="op-m"><h4>-</h4></div>
                <div class="op-ml"><h4>*</h4></div>
                <div class="op-dv"><h4>/</h4></div>
                <div class="op-eq"><h4>=</h4></div>
                <div class="op-bracket"><h4>()</h3></div>
                <div class="point"><h4>.</h4></div>
                <div class="clear"><h4>C</h4></div>
                <div class="mod"><h4>%</h4></div>
                

            </div>
        </div>
    </body>
</html>
