<html>
  <head>
    <style>
      * {
        padding: 0;

      }
      header {
        height: 100vh;
        /* background-color: rgba(100, 100, 100, 1); */
        background-image: url(https://images.unsplash.com/photo-1509226704106-8a5a71ffbfa4?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D);
        background-repeat: no-repeat;
        background-position: top;
        background-size: cover;
      }
       nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: white;
        padding: 10px 20px;
       
      }
       a {
        text-decoration: none;

        padding: 10px;
      }
       header .maintext {
       color: white;
       font-size: 50;
       padding-left: 250px;
       padding-top: 50px;
       position: relative;
       top: 50px;
      }
      header .container{
        background-color: black;
           width: 900px;
    height: 95px;

    left: 90px;
    top: 70px;
    border-radius: 10px;
    position: relative;
   
  
}

  form{
    width: 850px;
    height: 70px;
    display: inline-flex;
    flex-direction: row;
    background-color: white;
    padding-left: 10px;
    padding-top: 7px;
    position: relative;
    border-radius: 10px;
    left: 15px;
    top: 10px; 
   
  }
  form .inp{
    display: flex;
    flex-direction: column;
    padding: 3px;

    top: 7px;

  }
  form .inp input {
  outline: none; 
  border: 1px solid #cccccc00; 
}

 #btn{
    width: 130px;
    height: 30px;
    background-color: red;
    color: white;
    border-radius: 7px;
    padding: 6px;
    margin-left: 10px;
    position: relative;
    top: 7px;
 }
 #btn .btn-txt{
    color: white;
    font-weight: bold;
    padding-top: 0px;

    top: 5px;
}
.container .inp .lbl{
  color: black;
  font-weight: bold;
}

  </head>
  <body>
    <header>
      <nav>
        <h1>TourTravel</h1>
        <div class="links">
          <a href="">Home</a>
          <a href="">About</a>
          <a href="">Packages</a>
          <a href="">Trending</a>
        </div>
      </nav>
      <h1 class="maintext">Exploring World with Us!</h1>
      <div class="container">
        <form >
            <div class="inp">

            </div>
            <div class="inp">
            <label class="lbl">Check In</label>

            </div>

            <input type="text" placeholder="Check Out">
            </div>
            <div class="inp">
            <label class="lbl">How Many Are You ?</label>

            </div>
            <div id="btn">
                <span class="btn-txt">Check Availability</span>
            </div>
        </form>
      </div>
