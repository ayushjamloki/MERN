<html>
  <head>
    <style>
      .container {
        height: 500px;
        width: 500px;
        position: relative;
        background-color: aqua;
      }
      .box {
        height: 100px;
        position: absolute;
        width: 100px;
        background-color: royalblue;
        border-radius: 10px;
        animation: move 1s infinite linear;
      }
      @keyframes move {
        100%,
        0% {
          top: 0;
          left: 0;
          transform: rotate(90deg);
        }
        25% {
          top: 0;
          left: 400px;
          transform: rotate(180deg);
        }
        50% {
          left: 400px;
          top: 400px;
          transform: rotate(270deg);
        }

        75% {
          left: 0;
          top: 400px;
          transform: rotate(360deg);
        }
        /* 100% {
          top: 0;
          left: 0;
        } */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box"></div>
    </div>
  </body>
</html>
