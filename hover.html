<html>
  <head>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      .container {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box {
        height: 250px;
        width: 250px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        border-radius: 10px;
        border: 10px solid;
        padding: 10px;
        overflow: hidden;
      }

      .box img {
        height: 100%;
        width: 100%;

        transition: all 1s
          linear(
            0 0%,
            0 1.8%,
            0.01 3.6%,
            0.03 6.35%,
            0.07 9.1%,
            0.13 11.4%,
            0.19 13.4%,
            0.27 15%,
            0.34 16.1%,
            0.54 18.35%,
            0.66 20.6%,
            0.72 22.4%,
            0.77 24.6%,
            0.81 27.3%,
            0.85 30.4%,
            0.88 35.1%,
            0.92 40.6%,
            0.94 47.2%,
            0.96 55%,
            0.98 64%,
            0.99 74.4%,
            1 86.4%,
            1 100%
          );
      }
      .box:active img {
        height: 140%;
        width: 140%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">
        <img src="images/image.png" alt="" />
      </div>
    </div>
  </body>
</html>
